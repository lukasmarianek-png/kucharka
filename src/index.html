<!-- Netlify Forms: skrytý formulář, aby Netlify zachytával zpětnou vazbu z appky -->
<form name="zpetna-vazba" data-netlify="true" netlify-honeypot="bot-field" hidden>

<div id="app"></div>

<nav class="tabbar" id="tabbar" aria-label="Hlavní navigace">
