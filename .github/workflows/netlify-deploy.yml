name: Nasadit na Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Spustit build na Netlify
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Chybí secret NETLIFY_BUILD_HOOK"; exit 1; fi
          curl -fsS -X POST -d '{}' "$HOOK"
          echo "Netlify build spuštěn"
